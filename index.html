<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doublet libre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-height editor — top bar, tool rail, canvas on chemists' hexagonal paper, properties panel, status line. */
:root {
  --bg: #E9EDEF;
  --surface: #FFFFFF;
  --paper: #FBFCFC;
  --ink: #17212B;
  --muted: #55626E;
  --rule: #D5DDE2;
  --hex: #E6ECEE;
  --e-arrow: #C2304A;
  --accent: #1D58A6;
  --accent-soft: #E3ECF8;
  --hl: rgba(29, 88, 166, 0.16);
  --hl-strong: rgba(29, 88, 166, 0.3);
  --warn: #B3600A;
  --warn-bg: #FBEFD9;
  --ok: #1E6A3F;
  --ok-bg: #E4F3EA;
  --danger: #B42318;
  --danger-rule: #E8B4AE;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --font-chem: Arial, Helvetica, "Liberation Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1015; --surface: #151D25; --paper: #111820; --ink: #E5EBEF; --muted: #9AA7B3; --rule: #2A3642; --hex: #19222B;
    --e-arrow: #FF7088; --accent: #7EB3F4; --accent-soft: #172A40; --hl: rgba(126, 179, 244, 0.18); --hl-strong: rgba(126, 179, 244, 0.34); --warn: #F2B65C; --warn-bg: #36270F;
    --ok: #86D3A4; --ok-bg: #13291D; --danger: #FF8A80; --danger-rule: #6B2B26;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1015; --surface: #151D25; --paper: #111820; --ink: #E5EBEF; --muted: #9AA7B3; --rule: #2A3642; --hex: #19222B;
  --e-arrow: #FF7088; --accent: #7EB3F4; --accent-soft: #172A40; --hl: rgba(126, 179, 244, 0.18); --hl-strong: rgba(126, 179, 244, 0.34); --warn: #F2B65C; --warn-bg: #36270F;
  --ok: #86D3A4; --ok-bg: #13291D; --danger: #FF8A80; --danger-rule: #6B2B26;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { height: 100%; }
body {
  height: 100%; margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
button, input, select { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app {
  height: 100%; display: grid;
  grid-template-columns: 64px minmax(0, 1fr) 280px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "tools stage panel" "status status status";
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden;
}

/* Top bar */
.top { grid-area: top; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.9rem; padding: 0.55rem 0.9rem; border-bottom: 1px solid var(--rule); }
.top .name { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; letter-spacing: -0.01em; }
.top .actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
.top .sep { width: 1px; height: 1.4rem; margin: 0 0.25rem; background: var(--rule); }
.top button.icon { display: grid; place-items: center; padding: 0.25rem 0.45rem; }
.top button, .panel button { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 0.25rem 0.65rem; cursor: pointer; }
.top button:hover:not(:disabled), .panel button:hover { border-color: var(--accent); }
.top button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.top button:disabled { opacity: 0.45; cursor: default; }
.top button.primary { display: inline-flex; align-items: center; gap: 0.4rem; background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.top button.primary:hover { filter: brightness(1.12); }
/* The mode: two buttons in one frame, the pressed one raised. */
.top .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--bg); border: 1px solid var(--rule); border-radius: 9px; }
.top .seg button { display: inline-flex; align-items: center; gap: 0.35rem; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-weight: 500; }
.top .seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / 0.18); }
.menu { position: relative; }
.menu summary { list-style: none; cursor: pointer; border: 1px solid var(--rule); border-radius: 6px; padding: 0.25rem 0.65rem; }
.menu summary::-webkit-details-marker { display: none; }
.menu summary::after { content: " ▾"; }
.menu > div { position: absolute; right: 0; top: calc(100% + 4px); z-index: 10; min-width: 15rem; display: grid; overflow-y: auto; padding: 4px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12); }
.top .menu button { border: 0; text-align: left; display: flex; justify-content: space-between; gap: 1rem; }
.top .menu button:hover { background: var(--accent-soft); }
.menu .menu-head { margin: 0.4rem 0.65rem 0.15rem; font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.menu kbd { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }

/* Tool rail */
.tools { grid-area: tools; display: flex; flex-direction: column; gap: 4px; padding: 8px; border-right: 1px solid var(--rule); min-height: 0; overflow-y: auto; scrollbar-width: none; }
.tool { position: relative; display: grid; place-items: center; height: 42px; border: 1px solid transparent; border-radius: 8px; background: transparent; cursor: pointer; color: var(--ink); }
.tool:hover { background: var(--accent-soft); }
.tool[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tool[hidden], .tool-group[hidden] { display: none; }
/* A line between two groups of tools that are both shown. */
.tool-group { display: flex; flex-direction: column; gap: 4px; }
.tool-group:not([hidden]) ~ .tool-group:not([hidden]) { border-top: 1px solid var(--rule); padding-top: 4px; }
.tool .tool-name { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.tool kbd { position: absolute; right: 4px; bottom: 2px; font-family: var(--font-mono); font-size: 0.6rem; color: var(--muted); }
.flyout { position: fixed; z-index: 10; max-height: calc(100vh - 16px); overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding: 4px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 4px 14px rgb(0 0 0 / 0.25); }
.flyout[hidden] { display: none; }
.flyout button { display: flex; align-items: center; justify-content: center; gap: 0.3rem; min-width: 2.6rem; padding: 0.3rem 0.5rem; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--ink); cursor: pointer; font: inherit; }
.flyout button:hover { background: var(--accent-soft); }
.flyout button span:empty { display: none; }
.flyout.named button { justify-content: flex-start; }
.flyout button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

/* Canvas */
.stage { grid-area: stage; min-width: 0; min-height: 0; position: relative; background: var(--paper); }
#canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: default; }
#canvas[data-tool="bond"], #canvas[data-tool="chain"], #canvas[data-tool="ring"], #canvas[data-tool="atom"], #canvas[data-tool="curved"], #canvas[data-tool="rxn"], #canvas[data-tool="text"], #canvas[data-tool="synthesis"], #canvas[data-tool="distillation"], #canvas[data-tool="separation"], #canvas[data-tool="glassware"], #canvas[data-tool="heating"] { cursor: crosshair; }
#canvas[data-tool="lonePair"], #canvas[data-tool="charge"], #canvas[data-tool="partial"] { cursor: cell; }
#canvas .marquee { fill: var(--hl); stroke: var(--accent); stroke-width: 1; stroke-dasharray: 4 3; }
#canvas[data-tool="erase"] { cursor: pointer; }
#canvas.pannable, #canvas.panning { cursor: grabbing; }
#canvas .hexline { fill: none; stroke: var(--hex); stroke-width: 1; }
#canvas .bd line { stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; }
#canvas .hash line { stroke: var(--ink); stroke-width: 1.2; }
#canvas .wedge { fill: var(--ink); }
#canvas .lbl { font-family: var(--font-chem); font-size: 15px; fill: var(--ink); }
#canvas .lp circle { fill: var(--ink); }
#canvas .pc, #canvas .chgt { font-family: var(--font-chem); font-size: 12px; fill: var(--ink); text-anchor: middle; }
#canvas .txt { font-family: var(--font-chem); fill: var(--ink); text-anchor: middle; }
#canvas .rx line, #canvas .rx polyline { stroke: var(--ink); stroke-width: 1.4; fill: none; }
#canvas .rxh { fill: var(--ink); }
#canvas .cond { font-family: var(--font-chem); font-size: 12px; fill: var(--ink); text-anchor: middle; }
#canvas .ea { fill: none; stroke: var(--e-arrow); stroke-width: 1.5; stroke-linecap: round; }
#canvas .eh { fill: var(--e-arrow); }
#canvas .gw { fill: none; stroke: var(--ink); stroke-width: 1.3; stroke-linejoin: round; stroke-linecap: round; }
#canvas .hit { fill: transparent; stroke: transparent; stroke-width: 10px; }
#canvas path.hit, #canvas line.hit { fill: none; pointer-events: stroke; }
#canvas circle.hit, #canvas rect.hit { stroke: none; }
#canvas .hl { fill: var(--hl); stroke: none; }
#canvas line.hl, #canvas path.hl { fill: none; stroke: var(--hl); stroke-width: 8px; stroke-linecap: round; }
#canvas .is-sel .hl { fill: var(--hl-strong); }
#canvas .is-sel line.hl, #canvas .is-sel path.hl { fill: none; stroke: var(--hl-strong); }
#canvas .guide { fill: none; stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 3; }
#canvas .handle rect { fill: var(--surface); stroke: var(--accent); stroke-width: 1.4; cursor: move; }
#canvas .ghost, #canvas .ghost-dot, #canvas .marquee, #canvas .warn { pointer-events: none; }
#canvas .warn { fill: none; stroke: var(--warn); stroke-width: 1.6; stroke-dasharray: 3 2; }
#canvas path.warn { stroke-width: 7; stroke-dasharray: none; opacity: 0.35; stroke-linecap: round; }
.panel .warnings { border-left: 3px solid var(--warn); background: var(--warn-bg); border-radius: 0 6px 6px 0; padding: 0.5rem 0.7rem; display: grid; gap: 0.3rem; }
.panel .warnings h3 { margin: 0; color: var(--warn); }
.panel .warnings ul { font-size: 0.85rem; }
#canvas .ghost { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
#canvas .ghost-dot { fill: var(--accent); }

/* Panel */
.panel { grid-area: panel; border-left: 1px solid var(--rule); padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6rem; min-width: 0; }
/* A long panel scrolls; nothing in it shrinks to fit (a squashed text field would hide what it holds). */
.panel > * { flex-shrink: 0; }
.panel h2 { font-family: var(--font-display); font-size: 1.05rem; margin: 0; }
.panel h3 { font-size: 0.8rem; margin: 0.6rem 0 0; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.panel p { margin: 0; }
.panel ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 0.3rem; }
.panel .muted { color: var(--muted); }
.panel .small { font-size: 0.82rem; }
.panel .counts { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.panel .label, .panel label { font-size: 0.78rem; color: var(--muted); }
.panel textarea { resize: vertical; font-family: var(--font-chem); }
.panel input, .panel textarea { width: 100%; border: 1px solid var(--rule); border-radius: 6px; padding: 0.35rem 0.5rem; background: var(--paper); }
.panel .row { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.panel .col { display: grid; gap: 0.35rem; }
.panel button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.panel .kv { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 0.8rem; margin: 0; }
.panel .kv dt { color: var(--muted); }
.panel .kv dd { margin: 0; font-family: var(--font-chem); }
/* The panel's header, for the chosen tool or the selection: an icon in a tinted square, the name, a key or a hint. */
.panel > h3:first-child { margin-top: 0; }
.panel .card { display: flex; align-items: center; gap: 0.65rem; }
.panel .card > :nth-child(2) { flex: 1; }
.panel .card-icon { flex: none; width: 2.4rem; height: 2.4rem; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.panel .card-icon .sym { font-family: var(--font-chem); font-weight: 700; }
.panel .card kbd { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 0.35rem; }
/* A selection's settings: elements in a grid, a list for one choice among several, − value + for a number. */
.panel .elements { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.panel .elements button { padding: 0.35rem 0; font-family: var(--font-chem); }
.panel .options { display: grid; gap: 4px; }
.panel .opt { display: flex; align-items: center; gap: 0.6rem; min-height: 2.4rem; text-align: left; }
.panel .opt small { margin-left: auto; font-size: 0.78rem; font-weight: 400; color: var(--muted); }
.panel .elements button[aria-pressed="true"], .panel .opt[aria-pressed="true"] { border-color: var(--accent); }
.panel .setting { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; font-size: 0.88rem; }
.panel .setting > output { padding-right: 0.9rem; font-family: var(--font-chem); color: var(--muted); }
.panel .stepper { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
.panel .stepper button { width: 2.4rem; padding: 0.3rem 0; border: 0; border-radius: 0; font-size: 1rem; }
.panel .stepper output { min-width: 2.6rem; display: grid; place-items: center; border-inline: 1px solid var(--rule); background: var(--paper); font-family: var(--font-chem); }
/* Its footer: copy, paste, delete; then back to the chosen tool's help. */
.panel .btns { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0.35rem; }
.panel button.danger { color: var(--danger); border-color: var(--danger-rule); }
.panel button.active-tool { margin-top: auto; padding: 0.6rem 0 0; border: 0; border-top: 1px solid var(--rule); border-radius: 0; background: none; text-align: left; color: var(--muted); font-size: 0.82rem; }
.panel button.active-tool b { color: var(--ink); font-weight: 600; }
.panel ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 0.5rem; font-size: 0.88rem; }
.panel ol.steps li { counter-increment: step; display: grid; grid-template-columns: 1.3rem 1fr; gap: 0.55rem; }
.panel ol.steps li::before { content: counter(step); width: 1.3rem; height: 1.3rem; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 0.72rem; font-weight: 600; }
.panel .ok { padding: 0.55rem 0.7rem; border-radius: 8px; background: var(--ok-bg); color: var(--ok); font-size: 0.85rem; }
.panel .tip { padding: 0.55rem 0.7rem; border-radius: 8px; background: var(--bg); font-size: 0.85rem; }
.panel .more { margin-top: auto; display: grid; gap: 0.35rem; padding-top: 0.6rem; }
.panel details summary { cursor: pointer; color: var(--accent); font-size: 0.82rem; }
.panel details ul, .panel details p { margin-top: 0.4rem; }

/* Status line: one line, for what the pointer is over and for messages, so that the canvas never moves. */
.status { grid-area: status; display: flex; padding: 0.4rem 0.9rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: 0.82rem; }
#status { flex: 1; min-width: 0; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status.kept::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 0.45rem; border-radius: 50%; background: var(--ok); vertical-align: 0.05em; }

/* Zoom, at the bottom right of the drawing: −, the zoom, +, and back to the whole drawing. */
.zoom-bar { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--rule); border-radius: 9px; box-shadow: 0 2px 8px rgb(0 0 0 / 0.08); }
.zoom-bar button { display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem; min-width: 2rem; height: 2rem; padding: 0 0.5rem; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-size: 0.85rem; }
.zoom-bar button:hover { background: var(--accent-soft); }
.zoom-bar .zoom { min-width: 3.2rem; text-align: center; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Fingers: wider click areas and handles, taller buttons, no double-tap zoom. */
@media (pointer: coarse) {
  #canvas [data-kind="atom"] > .hit, #canvas [data-kind="text"] > .hit, #canvas [data-kind="rxn"] > .hit { stroke: transparent; stroke-width: 14px; }
  #canvas [data-kind="bond"] > .hit, #canvas [data-kind="curved"] > .hit { stroke-width: 22px; }
  #canvas .handle rect { transform-box: fill-box; transform-origin: center; transform: scale(1.8); }
  .top button, .menu summary, .panel button { min-height: 40px; }
  .zoom-bar button { height: 40px; min-width: 40px; }
  button, summary, .tool { touch-action: manipulation; }
}

@media (max-width: 760px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 60vh auto auto; grid-template-areas: "top" "tools" "stage" "panel" "status"; }
  .tools { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--rule); }
  .tool { width: 52px; }
  .top .sep { display: none; }
  /* Tools in a row on a phone: no groups, so that they wrap in as few rows as before. */
  .tool-group { display: contents; }
  .panel { border-left: 0; border-top: 1px solid var(--rule); }
  #status { white-space: normal; }
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
